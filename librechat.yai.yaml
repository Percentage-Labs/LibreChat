version: 1.3.14

cache: true

interface:
  customWelcome: 'Welcome to YAI Chat. Select YAI and add your own API key to begin.'
  modelSelect: true
  parameters: false
  presets: false
  prompts: false
  agents: false
  memories: false
  runCode: false
  webSearch: false
  marketplace:
    use: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
    configureObo: false
  fileSearch: false
  fileCitations: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  skills: false
  defaultPinnedTools: []

fileConfig:
  endpoints:
    YAI:
      disabled: true

endpoints:
  agents:
    disableBuilder: true
    allowedProviders:
      - 'YAI'
    capabilities: []

  custom:
    - name: 'YAI'
      apiKey: 'user_provided'
      baseURL: 'https://api.yaiprotocol.com/v1'
      models:
        default:
          - 'qwen3.6-35b-a3b'
        fetch: false
      titleConvo: false
      summarize: false
      modelDisplayLabel: 'YAI'
      addParams:
        streaming: false
        streamUsage: false
        disableStreaming: true
      dropParams:
        - 'tools'
        - 'tool_choice'
        - 'functions'
        - 'function_call'
        - 'parallel_tool_calls'
        - 'response_format'
        - 'stream_options'
        - 'useResponsesApi'
        - 'web_search'
        - 'url_context'
        - 'promptCache'
        - 'promptCacheTtl'
        - 'reasoning'
        - 'reasoning_effort'
        - 'reasoning_summary'
        - 'reasoning_mode'
        - 'reasoning_context'
        - 'verbosity'
        - 'temperature'
        - 'topP'
        - 'top_p'
        - 'topK'
        - 'top_k'
        - 'frequencyPenalty'
        - 'frequency_penalty'
        - 'presencePenalty'
        - 'presence_penalty'
        - 'stop'
        - 'n'
        - 'logprobs'
        - 'topLogprobs'
        - 'top_logprobs'
        - 'logitBias'
        - 'logit_bias'
        - 'seed'
        - 'user'
        - 'strict'
        - 'prediction'
        - 'modalities'
        - 'audio'
        - 'service_tier'
