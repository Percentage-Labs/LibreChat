version: 1.3.14

cache: true

interface:
  customWelcome: 'Welcome to YAI Chat. Your YAI account is connected automatically.'
  modelSelect: true
  parameters: false
  presets: false
  prompts: false
  agents: false
  memories: false
  runCode: false
  webSearch: true
  marketplace:
    use: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
    configureObo: false
  fileSearch: false
  fileCitations: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  skills: false
  defaultPinnedTools:
    - 'web_search'

fileConfig:
  endpoints:
    YAI:
      disabled: false

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  rerankerType: none
  tavilyApiKey: '${TAVILY_API_KEY}'

endpoints:
  agents:
    disableBuilder: true
    allowedProviders:
      - 'YAI'
    capabilities:
      - 'web_search'

  custom:
    - name: 'YAI'
      apiKey: 'yai-local-session'
      baseURL: 'http://yai-adapter:3001/v1'
      headers:
        Authorization: 'Bearer {{LIBRECHAT_USER_ID}}'
      models:
        default:
          - 'qwen3.5-9b'
        fetch: false
      titleConvo: true
      titleModel: 'current_model'
      titleMethod: 'completion'
      titleTiming: 'immediate'
      titlePrompt: |-
        Create a concise topic title of 3 to 7 words in the language of the user message. Return only the title, without quotation marks or commentary.

        Conversation:
        {convo}
      summarize: false
      modelDisplayLabel: 'YAI'
      addParams:
        streaming: true
        streamUsage: true
        disableStreaming: false
      dropParams:
        - 'functions'
        - 'function_call'
        - 'parallel_tool_calls'
        - 'response_format'
        - 'stream_options'
        - 'useResponsesApi'
        - 'web_search'
        - 'url_context'
        - 'promptCache'
        - 'promptCacheTtl'
        - 'reasoning'
        - 'reasoning_effort'
        - 'reasoning_summary'
        - 'reasoning_mode'
        - 'reasoning_context'
        - 'verbosity'
        - 'temperature'
        - 'topP'
        - 'top_p'
        - 'topK'
        - 'top_k'
        - 'frequencyPenalty'
        - 'frequency_penalty'
        - 'presencePenalty'
        - 'presence_penalty'
        - 'stop'
        - 'n'
        - 'logprobs'
        - 'topLogprobs'
        - 'top_logprobs'
        - 'logitBias'
        - 'logit_bias'
        - 'seed'
        - 'user'
        - 'strict'
        - 'prediction'
        - 'modalities'
        - 'audio'
        - 'service_tier'
